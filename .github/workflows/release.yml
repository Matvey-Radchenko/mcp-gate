name: Publish verified release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Verified stable version (must match Cargo, npm and acceptance evidence)
        required: true
        default: '0.1.2'
permissions:
  contents: read
jobs:
  evidence:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify required release evidence
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          node packaging/release-gate.mjs "$RELEASE_VERSION"
          node --test packaging/publish.test.mjs
          test "$REPOSITORY_PRIVATE" = false
  native:
    needs: evidence
    # Publication requires fresh checks on every release target, including both
    # Alpine smoke runs and Windows ARM64, in addition to stored acceptance.
    uses: ./.github/workflows/ci.yml
  publish:
    needs: native
    runs-on: macos-15
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Do not set registry-url. That writes NODE_AUTH_TOKEN and npm then
      # skips the GitHub OIDC token this job's id-token permission provides.
      - name: Install an npm CLI that can publish with GitHub OIDC
        run: npm install --global npm@11.15.0
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts
      - name: Verify all archives and write checksums
        run: node packaging/checksums.mjs artifacts
      - name: Publish platform packages, then launcher, without an npm token
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN
          npm exec -- node packaging/publish.mjs artifacts "$RELEASE_VERSION"
      - name: Create GitHub Release from these checked artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$RELEASE_VERSION" --target "$GITHUB_SHA" --title "mcp-gate $RELEASE_VERSION" --notes-file release/notes.md artifacts/native-*/*.tar.gz artifacts/SHA256SUMS
  homebrew:
    name: Homebrew tap
    needs: publish
    # Homebrew waits. The job runs only when the repository variable
    # HOMEBREW_TAP_ENABLED is the string true. An unset variable skips the
    # job, and a skipped job does not fail the release.
    if: ${{ vars.HOMEBREW_TAP_ENABLED == 'true' }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Skip when HOMEBREW_TAP_TOKEN is absent
        id: gate
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "HOMEBREW_TAP_TOKEN is absent; skipping Homebrew tap update."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.present == 'true'
        with:
          node-version: '24'
      - name: Download the Release checksums
        if: steps.gate.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release download "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$RUNNER_TEMP/mcp-gate-release"
      - name: Render the formula
        if: steps.gate.outputs.present == 'true'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node packaging/homebrew.mjs "$RUNNER_TEMP/mcp-gate-release/SHA256SUMS" "$RELEASE_VERSION" "$RUNNER_TEMP/mcp-gate.rb"
      - name: Push Formula/mcp-gate.rb to the personal tap
        if: steps.gate.outputs.present == 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          askpass=$(mktemp)
          trap 'rm -f "$askpass"' EXIT
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\n" x-access-token ;;' \
            '  *) printf "%s\n" "$HOMEBREW_TAP_TOKEN" ;;' \
            'esac' > "$askpass"
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          tap="$RUNNER_TEMP/homebrew-tap"
          git clone "https://github.com/Matvey-Radchenko/homebrew-tap.git" "$tap"
          branch=$(git -C "$tap" symbolic-ref --short refs/remotes/origin/HEAD)
          branch=${branch#origin/}
          mkdir -p "$tap/Formula"
          cp "$RUNNER_TEMP/mcp-gate.rb" "$tap/Formula/mcp-gate.rb"
          git -C "$tap" add Formula/mcp-gate.rb
          if git -C "$tap" diff --cached --quiet; then
            echo "Homebrew formula already matches mcp-gate $RELEASE_VERSION."
            exit 0
          fi
          git -C "$tap" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "mcp-gate $RELEASE_VERSION"
          git -C "$tap" push origin "HEAD:${branch}"
  registry:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, windows-2025, windows-11-arm, ubuntu-22.04, ubuntu-22.04-arm]
        include:
          - runner: ubuntu-24.04
            alpine: true
          - runner: ubuntu-24.04-arm
            alpine: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ !matrix.alpine }}
        with:
          node-version: '24'
      - name: Download and verify the GitHub Release binary
        if: ${{ !matrix.alpine }}
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node packaging/download-smoke.mjs "$RELEASE_VERSION"
      - name: Install from the real npm registry
        if: ${{ !matrix.alpine }}
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node packaging/registry-install.mjs "$RELEASE_VERSION"
      - name: Verify the GitHub archive and npm installation on Alpine
        if: matrix.alpine
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --env RELEASE_VERSION \
            --volume "$PWD/packaging:/workspace/packaging:ro" --volume "$PWD/npm:/workspace/npm:ro" \
            --workdir /workspace node:24.22.3-alpine sh -euc '
              node packaging/download-smoke.mjs "$RELEASE_VERSION"
              node packaging/registry-install.mjs "$RELEASE_VERSION"
            '
