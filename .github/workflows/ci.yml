name: Native checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    # Pull requests run only the jobs their files can affect; see
    # packaging/ci-changes.mjs for the mapping. Pushes to main, manual runs and
    # the release workflow (workflow_call) always run everything.
    name: Changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      launcher: ${{ steps.scope.outputs.launcher }}
      native: ${{ steps.scope.outputs.native }}
      docker: ${{ steps.scope.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request merge commit and its first parent, the base tip.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Select jobs
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git diff --no-renames --name-only HEAD^1 HEAD | node packaging/ci-changes.mjs
          else
            node packaging/ci-changes.mjs --all
          fi
  scripts:
    # Cheap and always on: release scripts, release evidence and this selector.
    name: Release scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Release script checks
        run: |
          for file in packaging/*.mjs npm/mcp-gate/bin/*.cjs npm/mcp-gate/scripts/*.cjs tests/support/*.cjs; do node --check "$file"; done
          node --test packaging/*.test.mjs
  docker-intel:
    name: Docker on macOS Intel
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    uses: ./.github/workflows/docker-intel.yml
  docker-windows:
    name: Docker on Windows
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    # This separate acceptance job uses a checksum-pinned amd64 WSL image.
    uses: ./.github/workflows/docker-windows.yml
  launcher:
    name: Shared npm launcher
    needs: changes
    if: needs.changes.outputs.launcher == 'true'
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare one launcher for all native installations
        run: |
          node packaging/launcher.mjs
          cd dist
          npm pack ./mcp-gate --ignore-scripts
          tar -tzf matvei-radchenko-mcp-gate-[0-9]*.tgz > packed-names.txt
          grep -qx 'package/README.md' packed-names.txt
          grep -qx 'package/LICENSE' packed-names.txt
          grep -qx 'package/bin/mcp-gate.cjs' packed-names.txt
          if grep -q 'package/scripts/prepack.cjs' packed-names.txt; then
            echo "prepack guard must not be published"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: shared-npm-launcher
          path: dist/matvei-radchenko-mcp-gate-[0-9]*.tgz
          if-no-files-found: error
  native:
    needs: [changes, launcher]
    if: needs.changes.outputs.native == 'true'
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
            timeout: 40
          # Hosted Intel macOS runners vary widely in speed; slow ones exceeded 40.
          - runner: macos-15-intel
            target: darwin-x64
            timeout: 60
          - runner: windows-2025
            target: win32-x64
            timeout: 40
          - runner: windows-11-arm
            target: win32-arm64
            rust_target: aarch64-pc-windows-msvc
            timeout: 70
          - runner: ubuntu-22.04
            target: linux-x64
            timeout: 40
          - runner: ubuntu-22.04-arm
            target: linux-arm64
            timeout: 90
          # Same images as the glibc jobs. Ubuntu 24.04 runners restrict unprivileged
          # user namespaces through AppArmor, so Chrome's sandbox cannot start there and
          # the real-browser tests fail for reasons unrelated to the musl binary.
          - runner: ubuntu-22.04
            target: linux-x64-musl
            rust_target: x86_64-unknown-linux-musl
            timeout: 60
          - runner: ubuntu-22.04-arm
            target: linux-arm64-musl
            rust_target: aarch64-unknown-linux-musl
            timeout: 90
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      MCP_GATE_NATIVE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Release script checks
        run: |
          for file in packaging/*.mjs npm/mcp-gate/bin/*.cjs npm/mcp-gate/scripts/*.cjs tests/support/*.cjs; do node --check "$file"; done
          node --test packaging/*.test.mjs
      - name: Verify production Task Scheduler XML before compilation
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/check-task-scheduler.ps1
      - name: Install Rust checks
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.95.0
          if [[ -n "$RUST_TARGET" ]]; then rustup target add "$RUST_TARGET"; fi
          if [[ "$RUNNER_OS" == Windows && -n "$RUST_TARGET" ]]; then
            test "$(rustc --print host-tuple)" = "$RUST_TARGET"
          fi
      - name: Build the static musl target with Rust's self-contained toolchain
        if: endsWith(matrix.rust_target, '-musl')
        # No musl-gcc: Rust's musl targets link their own crt objects and musl libc,
        # and no crate here compiles C for Linux. Ubuntu 22.04's musl-gcc (musl 1.2.2)
        # produced x86_64 binaries that segfault at startup (CI run 45081653064).
        env:
          MUSL_TARGET: ${{ matrix.rust_target }}
        run: echo "CARGO_BUILD_TARGET=$MUSL_TARGET" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-1.95.0-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: rust-1.95.0-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}-
      - name: Repository harness
        run: cargo xtask check
      - name: Start and verify the Linux user service manager
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: |
          unit="user@$UID.service"
          manager_logs() {
            sudo systemctl status "$unit" "user-runtime-dir@$UID.service" --no-pager || true
            sudo journalctl -b -u "$unit" -u "user-runtime-dir@$UID.service" -n 50 --no-pager || true
          }
          trap manager_logs ERR
          # Keep the hosted runner's user manager alive across workflow steps.
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "$unit"
          export XDG_RUNTIME_DIR="/run/user/$UID"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          for ((attempt = 0; attempt < 30; attempt++)); do
            if [[ -S "$XDG_RUNTIME_DIR/bus" ]]; then break; fi
            sleep 1
          done
          if [[ ! -S "$XDG_RUNTIME_DIR/bus" ]]; then
            echo "User D-Bus socket did not appear at $XDG_RUNTIME_DIR/bus" >&2
            manager_logs
            exit 1
          fi
          version=$(timeout 10s systemctl --user show --property=Version --value)
          test -n "$version"
          echo "systemd user manager version: $version"
          printf '%s\n' "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
      - name: Temporary user service lifecycle
        # Skipped on win32-arm64: the windows-11-arm runner ran these tests 15-25x
        # slower than windows-2025 (523 s vs 21 s, 979 s vs 65 s in run 45073914008),
        # past the 25-minute budget and the 60 s recovery bound the test asserts.
        # The Task Scheduler code paths are architecture-independent and run
        # unchanged on win32-x64; the ARM64 job keeps the harness, real clients,
        # release binary, update/downgrade and archive install checks.
        if: matrix.target != 'win32-arm64'
        timeout-minutes: 25
        run: cargo test --locked --all-features --test installer --test installer_recovery -- --ignored
      - name: Install pinned native clients
        # Codex, OpenCode and Claude Code each ship a native win32-arm64 package.
        run: npm install --global @openai/codex@0.153.4 opencode-ai@1.14.23 @anthropic-ai/claude-code@2.1.160
      - name: Locate native client commands
        run: |
          for pair in CODEX_BINARY:codex OPENCODE_BINARY:opencode CLAUDE_BINARY:claude; do
            key="${pair%%:*}"
            name="${pair#*:}"
            binary="$(command -v "$name")"
            if [[ "$RUNNER_OS" == "Windows" ]]; then binary="$(cygpath -w "$binary.cmd")"; fi
            echo "$key=$binary" >> "$GITHUB_ENV"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned uv tool runner
        run: python -m pip install uv==0.11.3
      - name: Locate wrapper commands
        run: |
          for pair in NPX_BINARY:npx UVX_BINARY:uvx PYTHON_BINARY:python; do
            key="${pair%%:*}"
            name="${pair#*:}"
            binary="$(command -v "$name")"
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              if [[ -f "$binary.cmd" ]]; then binary="$binary.cmd";
              elif [[ -f "$binary.exe" ]]; then binary="$binary.exe"; fi
              binary="$(cygpath -w "$binary")"
            fi
            echo "$key=$binary" >> "$GITHUB_ENV"
          done
      - name: Install pinned browser MCP fixtures
        run: |
          npm ci --prefix runtime --ignore-scripts --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/mcp-gate-browser-fixtures" --ignore-scripts --no-audit --no-fund @playwright/mcp@0.0.80
          node -e 'const fs = require("node:fs"); const path = require("node:path"); fs.appendFileSync(process.env.GITHUB_ENV, `DEVTOOLS_NODE=${process.execPath}\nPLAYWRIGHT_ENTRYPOINT=${path.join(process.env.RUNNER_TEMP, "mcp-gate-browser-fixtures/node_modules/@playwright/mcp/cli.js")}\n`);'
      - name: Install and verify the pinned Linux browser
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          # The MCP package pins Playwright, which pins the Chromium revision.
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/mcp-gate-chromium"
          node "$PLAYWRIGHT_ENTRYPOINT" install-browser --with-deps --no-shell chromium
          browser=$(node -e '
            const { createRequire } = require("node:module");
            const { chromium } = createRequire(process.env.PLAYWRIGHT_ENTRYPOINT)("playwright");
            process.stdout.write(chromium.executablePath());
          ')
          test -x "$browser"
          echo "Browser executable: $browser"
          "$browser" --version
          echo "MCP_GATE_TEST_BROWSER=$browser" >> "$GITHUB_ENV"
      - name: Real clients, offline wrappers and browser lifecycle
        timeout-minutes: 10
        run: cargo test --locked --all-features --no-fail-fast --test native_codex --test native_clients --test wrappers --test native_chrome --test live_playwright -- --ignored
      - name: Prepare the pinned Linux Docker fixture image
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          # node:24.22.3-bookworm-slim index with native amd64 and arm64 images.
          DOCKER_IMAGE: node@sha256:dc26ae92c9fb15cf6b1d63e20f0944b2efe0f115b20e00be48fb23fceb061c54
        run: |
          if ! docker_binary=$(command -v docker); then
            echo "Docker is required on the Linux native runner" >&2
            exit 1
          fi
          "$docker_binary" info --format '{{.ServerVersion}} {{.OSType}} {{.Architecture}}'
          case "$RUNNER_ARCH" in
            X64) platform=linux/amd64 ;;
            ARM64) platform=linux/arm64 ;;
            *) echo "Unsupported Docker runner architecture: $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          "$docker_binary" pull --platform "$platform" "$DOCKER_IMAGE"
          actual=$("$docker_binary" image inspect --format '{{.Os}}/{{.Architecture}}' "$DOCKER_IMAGE")
          if [[ "$actual" != "$platform" ]]; then
            echo "Expected Docker image for $platform, found $actual" >&2
            exit 1
          fi
          "$docker_binary" run --rm --pull=never "$DOCKER_IMAGE" node --version
          printf '%s\n' "DOCKER_BINARY=$docker_binary" "DOCKER_IMAGE=$DOCKER_IMAGE" >> "$GITHUB_ENV"
      - name: Actual Linux Docker ownership, independent state and no replay
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: cargo test --locked --all-features --test docker -- --ignored
      - name: Build release binary
        run: node packaging/compile.mjs
      - name: Verify Linux release binary and glibc 2.35 compatibility
        if: runner.os == 'Linux' && !endsWith(matrix.rust_target, '-musl')
        run: |
          binary=./target/release/mcp-gate
          highest=$(readelf --version-info --wide "$binary" | grep -oE 'GLIBC_[[:alnum:]_.]+' | LC_ALL=C sort -V | tail -n 1)
          if [[ $(printf '%s\n' "$highest" GLIBC_2.35 | LC_ALL=C sort -V | tail -n 1) != GLIBC_2.35 ]]; then
            echo "Highest required glibc symbol version is $highest, above GLIBC_2.35" >&2
            exit 1
          fi
          echo "Highest required glibc symbol version: $highest"
          "$binary" --version
      - name: Verify static Linux release linkage
        if: endsWith(matrix.rust_target, '-musl')
        run: |
          binary=./target/release/mcp-gate
          readelf --program-headers --wide "$binary" > "$RUNNER_TEMP/mcp-gate-elf-headers"
          readelf --dynamic --wide "$binary" > "$RUNNER_TEMP/mcp-gate-elf-dynamic"
          if grep -Eq '^[[:space:]]*INTERP[[:space:]]' "$RUNNER_TEMP/mcp-gate-elf-headers" ||
             grep -Fq '(NEEDED)' "$RUNNER_TEMP/mcp-gate-elf-dynamic"; then
            echo "Expected a statically linked musl executable" >&2
            exit 1
          fi
          "$binary" --version
      - name: Verify standalone Windows runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/check-windows-runtime.ps1
      - name: Build unpublished version compatibility fixture
        run: node packaging/compat-build.mjs
      - name: Actual release update and compatible downgrade
        # Both binaries are built in this job (compat-build.mjs), so no published
        # win32-arm64 release is needed. The test takes ~25 s on windows-2025 but
        # was still running after 5 min on windows-11-arm (run 45094446937), which
        # is 15-25x slower for service tests; 20 min leaves about 2x headroom.
        timeout-minutes: ${{ matrix.target == 'win32-arm64' && 20 || 5 }}
        run: cargo test --locked --all-features --test installer_versions -- --ignored
      - uses: actions/download-artifact@v4
        with:
          name: shared-npm-launcher
          path: dist
      - name: Prepare and inspect npm archives
        run: |
          node packaging/build.mjs
          cd dist
          npm pack ./mcp-gate-bin-${{ matrix.target }} --ignore-scripts
      - name: Clean archive installation
        # npm installs the musl package only on musl hosts; the Alpine step below covers it.
        if: ${{ !endsWith(matrix.rust_target, '-musl') }}
        run: npm exec --offline --call 'node packaging/smoke.mjs'
      - name: Clean musl archive installation without glibc
        if: endsWith(matrix.rust_target, '-musl')
        # The musl npm package declares libc musl, so its install smoke runs only
        # here. Alpine has no systemd user manager; the service tests above run
        # the musl binary against systemd on the Ubuntu host.
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --volume "$PWD/packaging:/workspace/packaging:ro" --volume "$PWD/npm:/workspace/npm:ro" \
            --volume "$PWD/dist:/workspace/dist:ro" --workdir /workspace node:24.22.3-alpine \
            npm exec --offline --call 'node packaging/smoke.mjs'
      - name: Download archive
        run: |
          version=$(node -p "require('./npm/mcp-gate/package.json').version")
          cd dist/mcp-gate-bin-${{ matrix.target }}
          tar -czf "../mcp-gate-$version-${{ matrix.target }}.tar.gz" bin LICENSE README.md
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: |
            dist/*.tgz
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
      - name: Retain compilation cache after a failed acceptance check
        if: failure()
        # A Windows target upload has taken about seven minutes. Cap the step
        # so a stuck save fails here instead of holding the job open.
        timeout-minutes: 15
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-1.95.0-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
  archives:
    name: Combined release archives
    needs: native
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts
      - name: Verify all npm and native archives and shared launcher identity
        run: node packaging/checksums.mjs artifacts
  result:
    # One stable check for branch protection: it passes when every job either
    # succeeded or was skipped as not affected, and fails on any failure.
    name: CI result
    if: always()
    needs: [changes, scripts, docker-intel, docker-windows, launcher, native, archives]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require success or an intended skip
        env:
          SCOPE: ${{ needs.changes.outputs.scope }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "CI scope: $SCOPE"
          node -e '
            const needs = JSON.parse(process.env.RESULTS);
            let ok = needs.changes.result === "success" && needs.scripts.result === "success";
            for (const [job, { result }] of Object.entries(needs)) {
              console.log(`${job}: ${result}`);
              if (!["success", "skipped"].includes(result)) ok = false;
            }
            if (!ok) process.exit(1);
          '
