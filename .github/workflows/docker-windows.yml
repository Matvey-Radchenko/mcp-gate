name: Native Windows Docker acceptance
on:
  workflow_call:
permissions:
  contents: read
jobs:
  docker:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DOCKER_IMAGE: node@sha256:e67514e5d0f6c46656005e1b693b2ec9d52e80b641307de684d4a015ba7a4eaf
      MCP_GATE_WSL_DISTRO: mcp-gate-ci-${{ github.run_id }}-${{ github.run_attempt }}
      MCP_GATE_DOCKER_INLINE_FIXTURE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal && rustup default 1.95.0
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-1.95.0-win32-x64-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: rust-1.95.0-win32-x64-${{ hashFiles('Cargo.lock') }}-
      - name: Start an owned Linux engine through WSL2
        timeout-minutes: 12
        shell: pwsh
        run: ./packaging/test-docker-windows.ps1
      - name: Prepare the reviewed fixture image
        timeout-minutes: 5
        shell: pwsh
        run: |
          docker pull $env:DOCKER_IMAGE
          if ($LASTEXITCODE -ne 0) { throw 'Cannot pull the reviewed fixture image' }
          docker run --rm --pull=never $env:DOCKER_IMAGE node --version
          if ($LASTEXITCODE -ne 0) { throw 'Container runtime is unavailable' }
      - name: Native Windows gateway and Docker CLI ownership
        timeout-minutes: 8
        shell: bash
        run: cargo test --locked --all-features --test docker -- --ignored
      - name: Remove only the owned WSL distribution
        if: always()
        timeout-minutes: 3
        shell: pwsh
        run: ./packaging/test-docker-windows.ps1 -Cleanup
