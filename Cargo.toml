[package]
name = "mcp-gate"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Lazy local MCP gateway with managed client setup"
license = "MIT"
repository = "https://github.com/Matvey-Radchenko/mcp-gate"

[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
too_many_lines = "warn"
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

[lints]
workspace = true

[dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.6", features = ["derive"] }
fs2 = "0.4"
futures = "0.3"
http-body = "1.0"
libc = "0.2"
rmcp = { version = "=3.1.2", default-features = false, features = ["server", "client", "transport-io", "transport-streamable-http-server"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

toml_edit = { version = "0.25", features = ["serde"] }
json5 = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

# Optional local diagnostic build; never replaces the installed release.
[profile.diagnostic]
inherits = "release"
debug = "line-tables-only"
strip = "none"

[[bin]]
name = "mcp-gate"
path = "src/main.rs"

[[bin]]
name = "mock-backend"
path = "tests/support/mock_backend.rs"
required-features = ["test-backend"]

[features]
test-backend = []
